name: CEMP CI Pipeline

on:
  push:
    branches:
      - main

jobs:

  build-and-push:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4


    - name: Login to Azure Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}


    - name: Build Docker Image
      run: |
        docker build \
        -t ${{ secrets.ACR_LOGIN_SERVER }}/cemp-api:${{ github.sha }} \
        -f docker/Dockerfile .


    - name: Push Docker Image
      run: |
        docker push \
        ${{ secrets.ACR_LOGIN_SERVER }}/cemp-api:${{ github.sha }}
        
    - name: Deploy to Kubernetes using Helm
      run: |

        helm upgrade --install cemp ./cemp-chart \
        --set image.repository=${{ secrets.ACR_LOGIN_SERVER }}/cemp-api \
        --set image.tag=${{ github.sha }}

    - name: Build Completed
      run: |
        echo "Docker image pushed successfully"