name: CEMP CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Login to Azure Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build Docker Image
      run: |
        docker build \
        -t ${{ secrets.ACR_LOGIN_SERVER }}/cemp-api:${{ github.sha }} \
        -t ${{ secrets.ACR_LOGIN_SERVER }}/cemp-api:latest \
        -f docker/Dockerfile .

    - name: Push Docker Image
      run: |
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/cemp-api:${{ github.sha }}
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/cemp-api:latest

    # --- AUTOMATED FIXES FOR THE 1-HOUR LAB RESET BELOW ---

    - name: Fix Control-Plane Taint (Lab VM)
      run: |
        kubectl taint nodes --all node-role.kubernetes.io/control-plane- 2>/dev/null || true
        kubectl taint nodes --all node-role.kubernetes.io/master- 2>/dev/null || true

    - name: Setup Azure Registry Secret in Kubernetes
      run: |
        kubectl delete secret acr-secret --ignore-not-found
        kubectl create secret docker-registry acr-secret \
          --docker-server="${{ secrets.ACR_LOGIN_SERVER }}" \
          --docker-username="${{ secrets.ACR_USERNAME }}" \
          --docker-password="${{ secrets.ACR_PASSWORD }}" \
          --docker-email="admin@example.com"

    - name: Setup Application ConfigMap
      run: |
        kubectl delete configmap cemp-config --ignore-not-found
        kubectl create configmap cemp-config \
          --from-literal=APP_NAME="Cloud Employee Management Platform" \
          --from-literal=APP_VERSION="1.0" \
          --from-literal=COMPANY_NAME="CEMP Corp"

    - name: Setup Database Credentials Secret
      run: |
        kubectl delete secret cemp-secret --ignore-not-found
        kubectl create secret generic cemp-secret \
          --from-literal=DB_SERVER="localhost" \
          --from-literal=DB_DATABASE="cemp_db" \
          --from-literal=DB_USERNAME="admin" \
          --from-literal=DB_PASSWORD="password123" \
          --from-literal=API_KEY="test_api_key"

    # --- END OF AUTOMATED EXTRA PROVISIONS ---

    # Now Helm can safely install your application because all requirements exist
    - name: Deploy to Kubernetes using Helm
      run: |
        helm upgrade --install cemp ./containerregistrycemp-chart \
        --set image.repository=${{ secrets.ACR_LOGIN_SERVER }}/cemp-api \
        --set image.tag=${{ github.sha }} \
        --set service.type=NodePort \
        --set service.port=80 \
        --set service.nodePort=30080 \
        --set replicaCount=1 \
        --set serviceAccount.create=false

    - name: Verify Deployment
      run: |
        kubectl get pods
        kubectl get svc cemp-api-service
        kubectl get events --sort-by=.lastTimestamp | tail -20

    - name: Build Completed
      run: |
        echo "Docker image pushed with ${{ github.sha }} and latest tag and application deployed cleanly!"