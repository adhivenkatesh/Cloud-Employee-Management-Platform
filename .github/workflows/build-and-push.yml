name: CEMP CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    # SUCCESS: Changed from self-hosted to GitHub's free automated cloud pool!
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Connects the GitHub runner securely to your temporary Azure account
    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # Automatically grabs the secure kubeconfig access key for your cluster
    - name: Set Kubernetes Context
      uses: azure/aks-set-context@v4
      with:
        resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}
        cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

    - name: Login to Azure Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build Docker Image
      run: |
        docker build \
        -t ${{ secrets.ACR_LOGIN_SERVER }}/cemp-api:${{ github.sha }} \
        -f docker/Dockerfile .

    - name: Push Docker Image
      run: |
        docker push \
        ${{ secrets.ACR_LOGIN_SERVER }}/cemp-api:${{ github.sha }}

    # Automatically provisions your environment dependencies
    - name: Setup Azure Registry Secret in Kubernetes
      run: |
        kubectl delete secret acr-secret --ignore-not-found
        kubectl create secret docker-registry acr-secret \
          --docker-server="${{ secrets.ACR_LOGIN_SERVER }}" \
          --docker-username="${{ secrets.ACR_USERNAME }}" \
          --docker-password="${{ secrets.ACR_PASSWORD }}" \
          --docker-email="admin@example.com"

    - name: Setup Application ConfigMap
      run: |
        kubectl delete configmap cemp-config --ignore-not-found
        kubectl create configmap cemp-config \
          --from-literal=APP_NAME="Cloud Employee Management Platform" \
          --from-literal=APP_VERSION="1.0" \
          --from-literal=COMPANY_NAME="MyCompany"

    - name: Setup Database Credentials Secret
      run: |
        kubectl delete secret cemp-secret --ignore-not-found
        kubectl create secret generic cemp-secret \
          --from-literal=DB_SERVER="localhost" \
          --from-literal=DB_DATABASE="cemp_db" \
          --from-literal=DB_USERNAME="admin" \
          --from-literal=DB_PASSWORD="password123" \
          --from-literal=API_KEY="test_api_key"

    - name: Deploy to Kubernetes using Helm
      run: |
        helm upgrade --install cemp ./containerregistrycemp-chart \
        --set image.repository=${{ secrets.ACR_LOGIN_SERVER }}/cemp-api \
        --set image.tag=${{ github.sha }}

    - name: Build Completed
      run: |
        echo "Docker image pushed and application deployed cleanly!"
